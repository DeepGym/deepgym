name: DeepGym CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'deepgym/**'
      - '.github/workflows/deepgym-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'deepgym/**'
      - '.github/workflows/deepgym-ci.yml'

defaults:
  run:
    working-directory: deepgym

jobs:
  test:
    name: DeepGym Test (Python ${{ matrix.python-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: deepgym/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest --tb=short -q -n auto --dist loadgroup
        env:
          DEEPGYM_NO_AUTH: 'true'

  integrations:
    name: Framework integrations (TRL, lm-eval, datasets on CPU)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deepgym/pyproject.toml

      # CPU-only torch keeps the job small. TRL 1.15 computes GRPO log-probs with Triton GPU
      # kernels, so CPU runners stay on TRL 1.14, whose reward and advantage code is the same.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,hf,lm_eval]" "trl>=1.6,<1.15"

      - name: Run integration tests
        run: pytest --tb=short -q -n 2 tests/test_integrations*.py
        env:
          DEEPGYM_NO_AUTH: 'true'
          TRL_EXPERIMENTAL_SILENCE: '1'

  console-ui:
    name: Console UI (lint, types, tests, build)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: deepgym/console-ui

    steps:
      - uses: useblacksmith/checkout@v1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build static export
        run: bun run build

  publish:
    name: Publish DeepGym to PyPI
    runs-on: ubuntu-latest
    needs: [test, integrations, console-ui]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deepgym/pyproject.toml

      - uses: oven-sh/setup-bun@v2

      - name: Build console UI into src/deepgym/console/static
        working-directory: deepgym/console-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build package
        run: |
          python -m pip install build twine
          python -m build
          # The tag must name the built version, and the wheel must ship the console UI.
          python scripts/check_release.py "${GITHUB_REF_NAME#v}"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # No --skip-existing: a version that is already on PyPI fails the release loudly.
        run: python -m twine upload --non-interactive dist/*
