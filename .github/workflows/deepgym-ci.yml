name: DeepGym CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'deepgym/**'
      - '.github/workflows/deepgym-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'deepgym/**'
      - '.github/workflows/deepgym-ci.yml'

defaults:
  run:
    working-directory: deepgym

jobs:
  test:
    name: DeepGym Test (Python ${{ matrix.python-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: deepgym/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest --tb=short -q
        env:
          DEEPGYM_NO_AUTH: 'true'

  console-ui:
    name: Console UI (lint, types, tests, build)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: deepgym/console-ui

    steps:
      - uses: useblacksmith/checkout@v1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build static export
        run: bun run build

  publish:
    name: Publish DeepGym to PyPI
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [test, console-ui]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deepgym/pyproject.toml

      - uses: oven-sh/setup-bun@v2

      - name: Build console UI into src/deepgym/console/static
        working-directory: deepgym/console-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build package
        run: |
          python -m pip install build twine
          python -m build
          python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit('console UI missing from wheel' if 'deepgym/console/static/index.html' not in names else 0)"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
