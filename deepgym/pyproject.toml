[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepgym"
version = "0.4.2"
description = "RL training environments with verifiable rewards for coding agents"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "Abhishek Gahlot", email = "me@abhishek.it"},
]
keywords = ["reinforcement-learning", "rl", "grpo", "coding", "environments", "verifiable-rewards", "trl", "verl", "openrlhf", "lm-eval", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.24",
    # Harbor's task.toml; the stdlib has tomllib from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.20"]
daytona = ["daytona>=0.223"]
modal = ["modal>=1.6"]
e2b = ["e2b>=2.55"]
hf = ["datasets>=2.14", "huggingface_hub>=0.20"]
lm_eval = ["lm_eval>=0.4"]
traces = ["pyarrow>=14"]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "ruff", "fastapi>=0.100", "uvicorn[standard]>=0.20", "pyarrow>=14"]
all = ["daytona>=0.223", "modal>=1.6", "e2b>=2.55", "fastapi>=0.100", "uvicorn[standard]>=0.20", "datasets>=2.14", "huggingface_hub>=0.20", "pyarrow>=14", "pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://deepgym.io"
Repository = "https://github.com/DeepGym/deepgym"
Documentation = "https://github.com/DeepGym/deepgym#readme"
Issues = "https://github.com/DeepGym/deepgym/issues"

[project.scripts]
deepgym = "deepgym.cli:main"

[tool.hatch.build]
# The console UI build (console-ui -> src/deepgym/console/static) is gitignored; ship it anyway.
artifacts = ["src/deepgym/console/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepgym"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"
# UI sources and node_modules stay in git; the sdist carries only the built static artifact.
exclude = ["console-ui"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Task prompts and JSON payloads saved as .py are content, not code: formatting changes them.
extend-exclude = ["*.md", "src/deepgym/envs/cyber/*/reference_solution.py"]
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# These run with envs/computer_use/_checks.py and PARAMS prepended.
"src/deepgym/envs/computer_use/*/verifier.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
